<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TWEVIX PULSE™ | Impact Telemetry, Verified Talent &amp; Solution SaaS • By Twevix™</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="apple-touch-icon" href="favicon.png" />
  <style>
    :root {
      --bg-page: #f8fafc;
      --bg-card: #ffffff;
      --navy: #0f172a;
      --slate: #475569;
      --muted: #64748b;
      --blue: #0284c7;
      --blue-dark: #0369a1;
      --teal: #0d9488;
      --indigo: #4f46e5;
      --border: #e2e8f0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
      background-color: var(--bg-page);
      color: var(--navy);
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 1180px;
      margin: 0 auto;
      padding: 0 28px;
    }

    /* --- TOP NAVIGATION (MIRRORING TWEVIX.COM) --- */
    header {
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 0;
      flex-wrap: wrap;
      gap: 16px;
    }

    .brand-lockup {
      display: flex;
      align-items: center;
      gap: 14px;
      text-decoration: none;
      color: var(--navy);
    }

    .brand-lockup img {
      height: 46px;
      width: auto;
      border-radius: 50%;
      object-fit: contain;
    }

    .brand-title {
      font-size: 1.2rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--navy);
    }

    .brand-sub {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      color: var(--blue);
      text-transform: uppercase;
      margin-top: 2px;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 22px;
      flex-wrap: wrap;
    }

    .nav-links a {
      text-decoration: none;
      color: var(--slate);
      font-weight: 600;
      font-size: 0.9rem;
      transition: color 0.2s ease;
    }

    .nav-links a:hover {
      color: var(--blue);
    }

    /* --- BUTTONS --- */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: linear-gradient(135deg, var(--blue) 0%, var(--blue-dark) 100%);
      color: #ffffff !important;
      padding: 13px 24px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.94rem;
      text-decoration: none;
      box-shadow: 0 6px 16px rgba(2, 132, 199, 0.22);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 22px rgba(2, 132, 199, 0.3);
    }

    .btn-outline {
      background: #ffffff;
      color: var(--navy) !important;
      border: 1.5px solid #cbd5e1;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
    }

    .btn-outline:hover {
      border-color: var(--blue);
      color: var(--blue) !important;
    }

    /* --- HERO SECTION (TWO-COLUMN SPLIT LIKE TWEVIX.COM) --- */
    .hero {
      background: linear-gradient(180deg, #f0f9ff 0%, #f8fafc 100%);
      border-bottom: 1px solid var(--border);
      padding: 80px 0 88px 0;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 48px;
      align-items: center;
    }

    .eyebrow {
      display: inline-block;
      background: #e0f2fe;
      color: var(--blue-dark);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 7px 16px;
      border-radius: 999px;
      margin-bottom: 20px;
    }

    .hero h1 {
      font-size: 2.85rem;
      font-weight: 800;
      line-height: 1.16;
      letter-spacing: -0.025em;
      margin-bottom: 20px;
      color: var(--navy);
    }

    .hero h1 span {
      color: var(--blue);
    }

    .hero-desc {
      font-size: 1.12rem;
      color: var(--slate);
      line-height: 1.75;
      margin-bottom: 32px;
    }

    /* Right-hand Hero Stack Cards */
    .hero-stack {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .stack-item {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 22px 24px;
      display: flex;
      align-items: center;
      gap: 18px;
      box-shadow: 0 8px 22px rgba(15, 23, 42, 0.05);
    }

    .icon-box {
      width: 60px;
      height: 60px;
      min-width: 60px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-blue { background: #e0f2fe; color: var(--blue); }
    .icon-teal { background: #ccfbf1; color: var(--teal); }
    .icon-indigo { background: #e0e7ff; color: var(--indigo); }

    .stack-item h3 {
      font-size: 1.08rem;
      font-weight: 800;
      color: var(--navy);
      margin-bottom: 2px;
    }

    .stack-item p {
      font-size: 0.9rem;
      color: var(--slate);
    }

    /* 3 Horizontal Pills below Hero (Matching twevix.com) */
    .pill-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: 44px;
      padding-top: 32px;
      border-top: 1px solid #e2e8f0;
    }

    .feature-pill {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 10px 20px;
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--navy);
      display: inline-flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.03);
    }

    /* --- SECTIONS --- */
    section {
      padding: 84px 0;
    }

    .section-white {
      background: #ffffff;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }

    .kicker {
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      color: var(--blue);
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .section-title {
      font-size: 2.1rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 14px;
      color: var(--navy);
    }

    .section-lead {
      font-size: 1.06rem;
      color: var(--slate);
      max-width: 780px;
      margin-bottom: 44px;
      line-height: 1.7;
    }

    /* --- 01 FLAGSHIP ENGINE BANNER (MATCHING TWEVIX.COM) --- */
    .flagship-card {
      background: linear-gradient(135deg, #ffffff 0%, #f0f9ff 100%);
      border: 1.5px solid #bae6fd;
      border-radius: 20px;
      padding: 44px;
      box-shadow: 0 12px 30px rgba(2, 132, 199, 0.07);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 28px;
    }

    .flagship-text {
      max-width: 740px;
    }

    .flagship-text h2 {
      font-size: 1.9rem;
      font-weight: 800;
      margin-bottom: 12px;
      color: var(--navy);
    }

    .flagship-text p {
      font-size: 1.04rem;
      color: var(--slate);
      line-height: 1.75;
    }

    /* --- 3-COLUMN CARDS (MATCHING TWEVIX.COM) --- */
    .grid-3 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(330px, 1fr));
      gap: 28px;
    }

    .card {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 36px 32px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.04);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: #38bdf8;
      box-shadow: 0 16px 34px rgba(2, 132, 199, 0.11);
    }

    .card .icon-box {
      width: 66px;
      height: 66px;
      margin-bottom: 22px;
    }

    .card h3 {
      font-size: 1.32rem;
      font-weight: 800;
      margin-bottom: 12px;
      color: var(--navy);
      line-height: 1.3;
    }

    .card p {
      font-size: 0.98rem;
      color: var(--slate);
      line-height: 1.7;
      margin-bottom: 26px;
    }

    /* --- PRICING / SUBSCRIPTION LIST --- */
    .price {
      font-size: 2.2rem;
      font-weight: 800;
      color: var(--navy);
      margin: 10px 0 18px 0;
    }

    .price span {
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--muted);
    }

    .plan-list {
      list-style: none;
      margin-bottom: 28px;
    }

    .plan-list li {
      padding: 9px 0;
      border-bottom: 1px solid #f1f5f9;
      font-size: 0.95rem;
      color: var(--slate);
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }

    .plan-list li::before {
      content: "✓";
      color: var(--teal);
      font-weight: 800;
    }

    /* --- FOUNDER CARD (MATCHING TWEVIX.COM) --- */
    .founder-card {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 44px;
      box-shadow: 0 8px 26px rgba(15, 23, 42, 0.04);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 28px;
    }

    .founder-text {
      max-width: 740px;
    }

    .founder-text h3 {
      font-size: 1.48rem;
      font-weight: 800;
      margin: 6px 0 12px 0;
      color: var(--navy);
    }

    .founder-text p {
      font-size: 1.02rem;
      color: var(--slate);
      line-height: 1.75;
    }

    /* --- FOOTER (MATCHING TWEVIX.COM) --- */
    footer {
      background: #ffffff;
      border-top: 1px solid var(--border);
      padding: 40px 0;
      color: var(--slate);
      font-size: 0.94rem;
    }

    .footer-bar {
      display: flex;
