<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TWEVIX PULSE™ | Impact Telemetry, Talent Sourcing &amp; Solution SaaS • By Twevix™</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="apple-touch-icon" href="favicon.png" />
  <style>
    :root {
      --bg-white: #ffffff;
      --bg-slate: #f8fafc;
      --navy: #0f172a;
      --slate-text: #475569;
      --slate-muted: #64748b;
      --blue: #0284c7;
      --blue-dark: #0369a1;
      --teal: #0d9488;
      --indigo: #4f46e5;
      --amber: #d97706;
      --border: #e2e8f0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
      background-color: var(--bg-white);
      color: var(--navy);
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 1180px;
      margin: 0 auto;
      padding: 0 32px;
    }

    /* --- TOP HEADER --- */
    header {
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 0;
      flex-wrap: wrap;
      gap: 16px;
    }

    .brand-lockup {
      display: flex;
      align-items: center;
      gap: 14px;
      text-decoration: none;
      color: var(--navy);
    }

    .brand-lockup img {
      height: 48px;
      width: auto;
      border-radius: 50%;
      object-fit: contain;
    }

    .brand-name {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--navy);
    }

    .brand-motto {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      color: var(--blue);
      text-transform: uppercase;
      margin-top: 2px;
    }

    .nav-menu {
      display: flex;
      align-items: center;
      gap: 26px;
      flex-wrap: wrap;
    }

    .nav-menu a {
      text-decoration: none;
      color: var(--slate-text);
      font-weight: 600;
      font-size: 0.95rem;
      transition: color 0.2s ease;
    }

    .nav-menu a:hover {
      color: var(--blue);
    }

    /* --- BUTTONS --- */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: linear-gradient(135deg, var(--blue) 0%, var(--blue-dark) 100%);
      color: #ffffff !important;
      padding: 14px 26px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.96rem;
      text-decoration: none;
      box-shadow: 0 6px 18px rgba(2, 132, 199, 0.24);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(2, 132, 199, 0.32);
    }

    .btn-secondary {
      background: #ffffff;
      color: var(--navy) !important;
      border: 1.5px solid #cbd5e1;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.05);
    }

    .btn-secondary:hover {
      border-color: var(--blue);
      color: var(--blue) !important;
    }

    /* --- HERO SECTION --- */
    .hero {
      background: linear-gradient(180deg, #f0f9ff 0%, #ffffff 100%);
      border-bottom: 1px solid var(--border);
      padding: 88px 0 96px 0;
    }

    .eyebrow-pill {
      display: inline-block;
      background: #e0f2fe;
      color: var(--blue-dark);
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 8px 18px;
      border-radius: 999px;
      margin-bottom: 22px;
    }

    .hero h1 {
      font-size: 3rem;
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: -0.025em;
      max-width: 880px;
      margin-bottom: 22px;
      color: var(--navy);
    }

    .hero h1 span {
      color: var(--blue);
    }

    .hero-lead {
      font-size: 1.18rem;
      color: var(--slate-text);
      max-width: 800px;
      margin-bottom: 36px;
      line-height: 1.75;
    }

    .hero-cta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 56px;
    }

    .hero-highlights {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 24px;
    }

    .highlight-card {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 28px;
      display: flex;
      align-items: flex-start;
      gap: 18px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.05);
    }

    .icon-lg {
      width: 68px;
      height: 68px;
      min-width: 68px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-blue { background: #e0f2fe; color: var(--blue); }
    .icon-teal { background: #ccfbf1; color: var(--teal); }
    .icon-indigo { background: #e0e7ff; color: var(--indigo); }
    .icon-amber { background: #fef3c7; color: var(--amber); }

    .highlight-card h3 {
      font-size: 1.12rem;
      font-weight: 800;
      margin-bottom: 6px;
      color: var(--navy);
    }

    .highlight-card p {
      font-size: 0.94rem;
      color: var(--slate-text);
      line-height: 1.55;
    }

    /* --- SECTIONS & CARDS --- */
    section {
      padding: 96px 0;
    }

    .section-alt {
      background-color: var(--bg-slate);
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }

    .section-index {
      font-size: 0.82rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      color: var(--blue);
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .section-heading {
      font-size: 2.25rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 16px;
      color: var(--navy);
    }

    .section-subtext {
      font-size: 1.1rem;
      color: var(--slate-text);
      max-width: 780px;
      margin-bottom: 48px;
      line-height: 1.75;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(460px, 1fr));
      gap: 32px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(330px, 1fr));
      gap: 32px;
    }

    .saas-card {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 40px 36px;
      box-shadow: 0 8px 26px rgba(15, 23, 42, 0.05);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .saas-card:hover {
      transform: translateY(-4px);
      border-color: #38bdf8;
      box-shadow: 0 16px 36px rgba(2, 132, 199, 0.12);
    }

    .saas-card .icon-lg {
      margin-bottom: 24px;
    }

    .saas-card h3 {
      font-size: 1.38rem;
      font-weight: 800;
      margin-bottom: 14px;
      color: var(--navy);
      line-height: 1.3;
    }

    .saas-card p {
      font-size: 1rem;
      color: var(--slate-text);
      line-height: 1.7;
      margin-bottom: 28px;
    }

    .price-tag {
      font-size: 2.3rem;
      font-weight: 800;
      color: var(--navy);
      margin: 12px 0 20px 0;
    }

    .price-tag span {
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--slate-muted);
    }

    .check-list {
      list-style: none;
      margin-bottom: 32px;
    }

    .check-list li {
      padding: 10px 0;
      border-bottom: 1px solid #f1f5f9;
      font-size: 0.97rem;
      color: var(--slate-text);
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }

    .check-list li::before {
      content: "✓";
      color: var(--teal);
      font-weight: 800;
      font-size: 1.05rem;
    }

    .founder-card {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 48px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.05);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 32px;
    }

    .founder-info {
      max-width: 740px;
    }

    .founder-info h3 {
      font-size: 1.55rem;
      font-weight: 800;
      margin: 8px 0 14px 0;
      color: var(--navy);
    }

    .founder-info p {
      font-size: 1.05rem;
      color: var(--slate-text);
      line-height: 1.75;
    }

    footer {
      background: var(--bg-slate);
      border-top: 1px solid var(--border);
      padding: 48px 0;
      color: var(--slate-text);
      font-size: 0.95rem;
    }

    .footer-flex {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 20px;
    }

    @media (max-width: 768px) {
      .hero h1 { font-size: 2.2rem; }
      .grid-2 { grid-template-columns: 1fr; }
      .founder-card, .saas-card { padding: 28px 24px; }
    }
  </style>
</head>
